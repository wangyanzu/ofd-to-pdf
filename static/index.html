<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFD 转 PDF</title>
<style>
:root{--color-surface:#fafafa;--color-text:#1c1c1c;--color-muted:#737373;--color-primary:#1c1c1c;--color-accent:#e9e9e9;--color-border:#d6d6d6;--color-success:#3d6d52;--color-warning:#856326;--color-error:#ad3838;--space-xs:8px;--space-sm:16px;--space-md:24px;--space-lg:40px;--space-xl:64px;--shadow-sm:0 2px 8px #00000003;--shadow-md:0 12px 50px #00000004;--shadow-lg:0 24px 90px #00000008;font-family:"Helvetica Neue","PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--color-text);background:var(--color-surface);font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100svh}header{height:104px;padding:0 6%;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;letter-spacing:.03em}.brand-icon{display:grid;place-items:center;background:var(--color-text);color:white;border-radius:7px;width:26px;height:29px;font-size:9px;letter-spacing:0}main{max-width:720px;margin:clamp(40px,10vh,110px) auto 80px;padding:0 24px;text-align:center}.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--color-muted);margin:0 0 22px}h1{font-weight:500;font-size:clamp(36px,6vw,48px);letter-spacing:-.045em;margin:0;line-height:1.2}.intro{font-size:16px;color:var(--color-muted);margin:20px 0 43px;line-height:1.7}.drop{position:relative;border:1px dashed #bcbcbc;border-radius:14px;background:#fff;min-height:300px;padding:45px 24px 36px;display:flex;align-items:center;flex-direction:column;justify-content:center;cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s;box-shadow:var(--shadow-md);outline:none}.drop:hover,.drop.drag,.drop:focus-visible{border-color:var(--color-text);background:#f5f5f5;box-shadow:0 0 0 4px #00000005}.icon{width:47px;height:58px;margin-bottom:25px;color:#444}.drop-title{font-size:18px;font-weight:500;margin:0 0 11px}.secondary{font-size:14px;color:var(--color-muted);margin:0;line-height:1.7}.choose{text-decoration:underline;text-underline-offset:4px;color:var(--color-text)}.formats{margin-top:27px;color:#929292;font-size:12px;letter-spacing:.05em}.footnote{font-size:12px;color:#919191;margin:23px 0 0;line-height:1.9}.bottom{display:flex;justify-content:center;gap:20px;margin-top:50px;font-size:12px;color:#8c8c8c}.bottom span+span:before{content:'·';margin-right:20px;color:#bbb}.file-label{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:22px;color:#737373;font-size:14px}.progress{width:160px;height:3px;background:#e8e8e8;margin:24px 0 3px;overflow:hidden;border-radius:3px}.progress:after{content:'';display:block;width:42%;height:100%;background:#222;animation:progress 1.5s ease-in-out infinite}.success{color:var(--color-success)}button{font:inherit}.download{border:0;background:var(--color-text);color:white;border-radius:7px;font-size:14px;padding:12px 25px;margin-top:23px;cursor:pointer}.reset{border:0;background:none;color:var(--color-muted);font-size:13px;cursor:pointer;margin-top:20px;text-decoration:underline;text-underline-offset:4px}.preview-controls{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;padding:5px;border:1px solid #e2e2e2;background:#fff;border-radius:10px;box-shadow:var(--shadow-md);white-space:nowrap}.preview-controls button{border:0;background:transparent;padding:9px 15px;border-radius:6px;color:#777;font-size:12px;cursor:pointer}.preview-controls button.active{color:#222;background:#efefef}.preview-label{position:fixed;bottom:40px;left:30px;font-size:11px;color:#999;letter-spacing:.05em}@keyframes progress{from{transform:translateX(-100%)}to{transform:translateX(340%)}}@media(max-width:600px){header{height:80px;padding:0 24px}main{margin-top:45px}.intro{font-size:14px;margin-bottom:32px}.drop{min-height:290px}.bottom{gap:12px;margin-top:35px}.bottom span+span:before{margin-right:12px}.preview-label{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><span class="brand-icon">O/P</span><span>OFD / PDF</span></header>
<main>
<p class="eyebrow">SIMPLE FILE CONVERTER</p>
<h1>OFD 转 PDF</h1>
<p class="intro">王总的得力工具，剩下的交给我！</p>
<div id="drop" class="drop" role="button" tabindex="0" aria-label="选择或拖放 OFD 文件"></div>
<input id="file" type="file" accept=".ofd" hidden>
<p class="footnote" id="footnote" aria-live="polite">转换完成后自动下载，无需额外操作。</p>
<div class="bottom"><span>保留页面布局</span><span>无需安装软件</span><span>文件不作留存</span></div>
</main>
<script src="./app.js" defer></script>
</body></html>
